<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị Viên - ExamAdmin</title>
    <!-- Bootstrap 5 css CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .login-header{
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .login-header i {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
            border-color: #0d6efd;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .input-group-text {
            background-color: #f8f9fa;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-user-shield"></i>
            <h4 class="fw-bold mb-1">ExamAdmin</h4>
            <p class="small text-white-500 mb-0">Hệ Thống Quản Lí Trực Tuyến</p>
        </div>
        <div class="card-body p-4">
            <form action="admin-dashboard.html">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold text-secondary">Tên đăng nhập / Emall</label>
                    <div class="input-group-text">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span> 
                        <input type="text" class="form-control" placeholder="Nhap ten dang nhap" required>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label small text-secondary fw-bold">Mật Khẩu</label>
                        <a href="#" class="small text-decoration-none text-primary">Quên mật khẩu</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Nhap mat khau" required>
                        
                    </div>    
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input">
                    <label for="remeber" class="form-check-label small text-secondary">Ghi nhớ đăng nhập</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập
                </button>
            </form>
        </div>
        <div class="card-footer bg-light text-center border-0 py-3">
            <small class="text-muted">Hệ Thống Thi trực tuyên &copy; 2026</small>
        </div>
    </div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
